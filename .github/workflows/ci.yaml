name: Continuous Integration
on:
  push:
    branches:
      - internal
  pull_request:

concurrency:
  group: '${{github.workflow}} @ ${{github.head_ref || github.ref_name}}'
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint
      - name: Lint types
        run: make test-types
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config: |
            name: Checkout Security Tests
            query-filters:
            paths-ignore:
              - '**/node_modules'
              - '**/*test*'
          queries: + security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: /language:javascript
  test_local:
    name: Unit test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - Chrome
          - Firefox
    steps:
      - uses: browser-actions/setup-chrome@v2
      - uses: browser-actions/setup-firefox@v1
      - uses: actions/checkout@v4
      - name: Unit test
        uses: coactions/setup-xvfb@v1
        env:
          BROWSER: ${{matrix.browser}}
          DISPLAY: :99
        with:
          run: make test-unit-ci
  test_remote:
    name: ${{matrix.type}} test (${{matrix.browser}})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        type:
          - Unit
          - End-to-end
        browser:
          - Chrome-Remote # no unit
          - Firefox-Remote # no unit
          - Safari-Remote
          - Edge-Remote
          - iOS-18-Remote
          - iOS-17-Remote
          - Android-14-Remote
          - Android-13-Remote
          - Android-12-Remote
    steps:
      - uses: ahmadnassri/action-workflow-queue@v1
      - uses: actions/checkout@v4
      - name: Unit test
        if: ${{matrix.type == 'Unit' && matrix.browser != 'Chrome-Remote' && matrix.browser != 'Firefox-Remote'}}
        uses: nick-fields/retry@v2
        env:
          BROWSER: ${{matrix.browser}}
          BROWSER_STACK_USERNAME: ${{secrets.BROWSER_STACK_USERNAME}}
          BROWSER_STACK_ACCESS_KEY: ${{secrets.BROWSER_STACK_ACCESS_KEY}}
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: make test-unit-ci
      - name: End-to-end test
        if: ${{matrix.type == 'End-to-end'}}
        uses: nick-fields/retry@v2
        env:
          BROWSER: ${{matrix.browser}}
          BROWSER_STACK_USERNAME: ${{secrets.BROWSER_STACK_USERNAME}}
          BROWSER_STACK_ACCESS_KEY: ${{secrets.BROWSER_STACK_ACCESS_KEY}}
        with:
          timeout_minutes: 16
          max_attempts: 2
          command: make test-e2e-ci
  integration_test:
    name: Integration test with react-checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mybusiness-app/react-checkout
          path: vendor
      - name: react-checkout
        env:
          CHECKOUT_JS_SHA: ${{github.sha}}
        run: |-
          cd vendor
          make test
  verify:
    name: Verify required checks
    runs-on: ubuntu-latest
    if: ${{always()}}
    needs:
      - lint
      - analyze
      - test_local
      # - test_remote
      # - integration_test
    steps:
      - name: Check status for pull requests
        if: |-
          ${{
            github.event_name == 'pull_request'
            && needs.lint.result != 'success'
            && needs.analyze.result != 'success'
            && needs.test_local.result != 'success'
          }}
        run: exit 1
  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs:
      - lint
      - analyze
      - test_local
      # - test_remote
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v2
      - name: Build
        run: make build
      - name: Run tests
        run: make test-unit-cov-ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./build/reports/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{secrets.GCR_QA_PUBLIC_DEVOPS_SA}}
      - uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: build
          destination: ${{secrets.ARTIFACT_BUCKET_NAME}}/checkout-js/${{github.sha}}/
          parent: false
